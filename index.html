    <script>
      // Suppress and stub Vite HMR WebSocket connection in preview environment
      try {
        const OrigWebSocket = window.WebSocket;
        if (OrigWebSocket) {
          window.WebSocket = function(url, protocols) {
            try {
              const ws = new OrigWebSocket(url, protocols);
              ws.onerror = function() {};
              return ws;
            } catch (e) {
              return {
                send: function() {},
                close: function() {},
                addEventListener: function() {},
                removeEventListener: function() {},
                readyState: 3
              };
            }
          };
          window.WebSocket.prototype = OrigWebSocket.prototype;
        }
      } catch (err) {}

      window.addEventListener('error', function(e) {
        if (e && e.message && (e.message.includes('WebSocket') || e.message.includes('vite') || e.message.includes('ws'))) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        if (e && e.reason && String(e.reason).includes('WebSocket')) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
    </script>
